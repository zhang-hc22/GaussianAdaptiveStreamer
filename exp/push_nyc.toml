# The push modes of exp/push_dips.toml on five more NYC cellular traces,
# picked at random instead of by their dips: 5 of the 21 NYC traces not in
# push_dips.toml, each from a random second that leaves 100 s before its end
# (seed 20261020). Replayed per millisecond as recorded, as there. Groups,
# warm-up and settings as in push_dips.toml.
#
#   for g in quic webrtc mae gcc gcc_mae; do
#     python exp/run_all.py --config exp/push_nyc.toml --only $g --out exp/results/nyc-${g//_/-}
#   done

[server]
resolution = "1280x720"
warmup_s = 10
timeout_s = 900
metric_stride = 12
paper_metrics = false

[quic]
mode = "wt"
event_ms = 40
scenes = ["train"]
trajectories = ["NTHU/train/user3_train.json"]
traces = ["nyc-2925703-home1", "nyc-3203600-timessquare", "nyc-3219061-home", "nyc-3453943-timessquare", "nyc-3552192-bus"]
scales = [1]
trace_start_s = {nyc-2925703-home1 = 143, nyc-3203600-timessquare = 170, nyc-3219061-home = 851, nyc-3453943-timessquare = 211, nyc-3552192-bus = 72}
rtt_ms = [20]
abrs = ["throughput"]
reps = 3

[webrtc]
transport = "webrtc"
pacing = "push"
event_ms = 40
push_fps = 60
warmup_mode = "reverse"
warmup_rate = "first"
scenes = ["train"]
trajectories = ["NTHU/train/user3_train.json"]
traces = ["nyc-2925703-home1", "nyc-3203600-timessquare", "nyc-3219061-home", "nyc-3453943-timessquare", "nyc-3552192-bus"]
scales = [1]
trace_start_s = {nyc-2925703-home1 = 143, nyc-3203600-timessquare = 170, nyc-3219061-home = 851, nyc-3453943-timessquare = 211, nyc-3552192-bus = 72}
rtt_ms = [20]
reps = 3

[mae]
transport = "webrtc"
pacing = "push"
event_ms = 40
push_fps = 60
warmup_mode = "reverse"
warmup_rate = "first"
sender_args = ["--enable_mae=true"]
scenes = ["train"]
trajectories = ["NTHU/train/user3_train.json"]
traces = ["nyc-2925703-home1", "nyc-3203600-timessquare", "nyc-3219061-home", "nyc-3453943-timessquare", "nyc-3552192-bus"]
scales = [1]
trace_start_s = {nyc-2925703-home1 = 143, nyc-3203600-timessquare = 170, nyc-3219061-home = 851, nyc-3453943-timessquare = 211, nyc-3552192-bus = 72}
rtt_ms = [20]
reps = 3

[gcc]
transport = "webrtc"
pacing = "push"
event_ms = 40
push_fps = 60
warmup_mode = "reverse"
warmup_rate = "first"
sender_args = ["--gcc_ai=4", "--gcc_mi=1.16"]
scenes = ["train"]
trajectories = ["NTHU/train/user3_train.json"]
traces = ["nyc-2925703-home1", "nyc-3203600-timessquare", "nyc-3219061-home", "nyc-3453943-timessquare", "nyc-3552192-bus"]
scales = [1]
trace_start_s = {nyc-2925703-home1 = 143, nyc-3203600-timessquare = 170, nyc-3219061-home = 851, nyc-3453943-timessquare = 211, nyc-3552192-bus = 72}
rtt_ms = [20]
reps = 3

[gcc_mae]
transport = "webrtc"
pacing = "push"
event_ms = 40
push_fps = 60
warmup_mode = "reverse"
warmup_rate = "first"
sender_args = ["--enable_mae=true", "--gcc_ai=4", "--gcc_mi=1.16"]
scenes = ["train"]
trajectories = ["NTHU/train/user3_train.json"]
traces = ["nyc-2925703-home1", "nyc-3203600-timessquare", "nyc-3219061-home", "nyc-3453943-timessquare", "nyc-3552192-bus"]
scales = [1]
trace_start_s = {nyc-2925703-home1 = 143, nyc-3203600-timessquare = 170, nyc-3219061-home = 851, nyc-3453943-timessquare = 211, nyc-3552192-bus = 72}
rtt_ms = [20]
reps = 3
