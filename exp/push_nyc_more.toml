# Five unused NYC traces; seed 20261021. See work/figs/tigas-push-nyc-more/selection.json.
[server]
resolution = "1280x720"
warmup_s = 10
timeout_s = 900
metric_stride = 12
paper_metrics = false

[quic]
mode = "wt"
abrs = ["throughput"]
event_ms = 40
scenes = ["train"]
trajectories = ["NTHU/train/user3_train.json"]
traces = ["nyc-2767958-taxi1", "nyc-3093662-home3", "nyc-3201711-timessquare", "nyc-3205967-timessquare", "nyc-3207521-timessquare"]
